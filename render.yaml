# Render Blueprint for the FastAPI backend.
# Secrets (MONGODB_URI) and the deployed frontend origin are entered in the Render dashboard.
services:
  - type: web
    name: climate-lens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: climate_lens
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        value: https://climate-lens(-[a-z0-9]+)?-karuturinoushikajays-projects\.vercel\.app
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Every *.onrender.com request passes Cloudflare, which overwrites this header with the client IP.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Fallback only when the header above is missing.
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      - key: OBSERVATION_CACHE_TTL_HOURS
        value: "720"
      - key: ANALYSIS_CACHE_TTL_HOURS
        value: "168"
      - key: RATE_LIMIT_ANALYZE_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_EXPORT_PER_MINUTE
        value: "10"
