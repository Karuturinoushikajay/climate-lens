name: keep-warm

# Pings the API health endpoint so the free Render instance (which sleeps after
# 15 idle minutes) is usually awake. GitHub runs schedules on a best-effort basis.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://climate-lens-api.onrender.com/api/health
