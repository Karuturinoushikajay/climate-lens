name: keep-warm

# Pings the API health endpoint so the free Render instance (which sleeps after
# 15 idle minutes) is usually awake. GitHub runs schedules on a best-effort basis.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /api/health
        # Retries span about 4 minutes so a brief Render restart (502) does not fail the run.
        run: curl -fsS --retry 5 --retry-delay 45 --retry-all-errors --max-time 90 https://climate-lens-api.onrender.com/api/health
